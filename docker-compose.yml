---
# PulseStream — Docker Compose Development Environment
# Starts all infrastructure services needed to run PulseStream locally.
#
# Usage:
#   docker compose up -d          # Start all services in background
#   docker compose ps             # Check service status
#   docker compose logs -f kafka  # Tail Kafka logs
#   docker compose down -v        # Stop and remove volumes (full reset)
#
# Services:
#   postgres      → PostgreSQL 16     (port 5432)
#   kafka         → Apache Kafka 3.7  (port 9092)
#   kafka-ui      → Kafka UI          (port 8090)
#   elasticsearch → ES 8.13           (port 9200)
#   kibana        → Kibana 8.13       (port 5601)
#   redis         → Redis 7           (port 6379)
#
# The application itself is NOT in this Compose file for M1.
# Run the Spring Boot app separately with: ./mvnw spring-boot:run
#
# Health checks use proper dependency probing — no "sleep 30" hacks.

services:

  # ─── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pulsestream-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-pulsestream}
      POSTGRES_USER:     ${POSTGRES_USER:-pulsestream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsestream_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsestream} -d ${POSTGRES_DB:-pulsestream}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ─── Apache Kafka 3.7 (KRaft mode — no Zookeeper) ──────────────────────────
  # KRaft = Kafka's built-in consensus (Zookeeper replacement, GA since Kafka 3.3).
  # Simpler local setup: one container instead of two.
  kafka:
    image: apache/kafka:3.7.0
    container_name: pulsestream-kafka
    environment:
      # KRaft configuration
      KAFKA_NODE_ID:                          1
      KAFKA_PROCESS_ROLES:                    broker,controller
      KAFKA_LISTENERS:                        PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES:        CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS:         1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS:                         /var/lib/kafka/data
      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "false"    # Topics created explicitly via script
      KAFKA_DEFAULT_REPLICATION_FACTOR:       1
      KAFKA_NUM_PARTITIONS:                   6
      # Message retention (7 days — events stay in Kafka if consumer is down)
      KAFKA_LOG_RETENTION_HOURS:              168
      KAFKA_LOG_SEGMENT_BYTES:                1073741824
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./docker/kafka/create-topics.sh:/docker-entrypoint-initdb.d/create-topics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─── Kafka UI (Provectus) ────────────────────────────────────────────────────
  # Lightweight web UI for browsing topics, messages, consumer groups.
  # Useful during development — not a production component.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pulsestream-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME:            pulsestream-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─── Elasticsearch 8.13 ─────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: pulsestream-elasticsearch
    environment:
      discovery.type:               single-node
      xpack.security.enabled:       "false"     # Security off for local dev — enable for production
      ES_JAVA_OPTS:                 "-Xms512m -Xmx512m"
      ELASTIC_PASSWORD:             ${ELASTICSEARCH_PASSWORD:-}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

  # ─── Kibana 8.13 ────────────────────────────────────────────────────────────
  # Must match Elasticsearch version exactly.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: pulsestream-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_NAME:         pulsestream-kibana
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ─── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pulsestream-redis
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

# ─── Named Volumes ────────────────────────────────────────────────────────────
# Data is persisted across container restarts.
# Use 'docker compose down -v' to wipe all data for a clean reset.
volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  elasticsearch_data:
    driver: local
